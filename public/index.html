<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记账本</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== 登录页 ===== -->
<div id="login-view" class="login-wrap hidden">
  <div class="login-card">
    <h1 class="logo">📒 记账本</h1>
    <p class="sub">多账本 · 预算管理 · 统计报表</p>
    <div class="tabs-mini">
      <button type="button" id="tab-login" class="active">登录</button>
      <button type="button" id="tab-register">注册</button>
    </div>
    <form id="login-form">
      <input id="login-username" placeholder="用户名" autocomplete="username">
      <input id="login-password" type="password" placeholder="密码" autocomplete="current-password">
      <button type="submit" class="btn primary block">登 录</button>
    </form>
    <form id="register-form" class="hidden">
      <input id="reg-username" placeholder="用户名（2-32 位字母/数字/中文）" autocomplete="username">
      <input id="reg-password" type="password" placeholder="密码（至少 6 位）" autocomplete="new-password">
      <input id="reg-nickname" placeholder="昵称（可选）">
      <button type="submit" class="btn primary block">注 册</button>
    </form>
    <p class="hint" id="login-hint"></p>
    <p class="hint muted">演示账号：demo / demo123（内含示例数据）</p>
  </div>
</div>

<!-- ===== 主应用 ===== -->
<div id="app-view" class="hidden">
  <header>
    <div class="brand">📒 记账本</div>
    <div class="ledger-switch">
      <label>账本</label>
      <select id="ledger-select" title="切换当前账本"></select>
    </div>
    <div class="user-box">
      <span id="user-nickname"></span>
      <button type="button" id="btn-logout" class="btn ghost sm">退出</button>
    </div>
  </header>

  <nav class="tabs">
    <button type="button" data-tab="record" class="active">记账</button>
    <button type="button" data-tab="stats">统计</button>
    <button type="button" data-tab="budget">预算</button>
    <button type="button" data-tab="ledger">账本与分类</button>
  </nav>

  <main>
    <!-- 记账页 -->
    <section id="tab-record" class="tab-pane active">
      <div class="grid-2">
        <div class="card">
          <h2 id="record-form-title">记一笔</h2>
          <form id="record-form">
            <div class="type-toggle">
              <button type="button" data-type="expense" class="active">支出</button>
              <button type="button" data-type="income">收入</button>
            </div>
            <div class="row">
              <input type="date" id="record-date">
              <input type="number" id="record-amount" placeholder="金额（元）" min="0.01" step="0.01" inputmode="decimal">
            </div>
            <div id="category-picker" class="category-grid"></div>
            <input type="text" id="record-note" placeholder="备注（可选）">
            <button type="submit" class="btn primary block" id="record-submit">保存</button>
            <button type="button" class="btn ghost block hidden" id="record-cancel">取消编辑</button>
          </form>
        </div>
        <div class="card">
          <h2>明细</h2>
          <div class="filter-bar">
            <input type="month" id="filter-month" title="月份">
            <select id="filter-type">
              <option value="">全部类型</option>
              <option value="expense">支出</option>
              <option value="income">收入</option>
            </select>
            <select id="filter-category"><option value="">全部分类</option></select>
            <input type="search" id="filter-keyword" placeholder="搜索备注">
            <button type="button" id="btn-export" class="btn ghost sm" title="按当前筛选条件导出 CSV">导出 CSV</button>
          </div>
          <div id="record-list" class="record-list"></div>
          <div class="pager">
            <button type="button" id="page-prev" class="btn ghost sm">上一页</button>
            <span id="page-info"></span>
            <button type="button" id="page-next" class="btn ghost sm">下一页</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 统计页 -->
    <section id="tab-stats" class="tab-pane">
      <div class="card">
        <div class="filter-bar">
          <input type="month" id="stats-month">
          <span class="muted">统计当前账本数据</span>
        </div>
        <div class="stat-cards">
          <div class="stat"><div class="label">收入</div><div class="value income" id="stat-income">--</div></div>
          <div class="stat"><div class="label">支出</div><div class="value expense" id="stat-expense">--</div></div>
          <div class="stat"><div class="label">结余</div><div class="value" id="stat-net">--</div></div>
          <div class="stat"><div class="label">笔数</div><div class="value" id="stat-count">--</div></div>
          <div class="stat"><div class="label">预算进度</div><div class="value" id="stat-budget">--</div></div>
        </div>
      </div>
      <div class="grid-2">
        <div class="card"><h2>近 12 个月收支趋势</h2><div id="chart-trend" class="chart"></div></div>
        <div class="card"><h2>本月支出分类占比</h2><div id="chart-pie" class="chart"></div></div>
      </div>
      <div class="card"><h2>本月每日收支</h2><div id="chart-daily" class="chart"></div></div>
    </section>

    <!-- 预算页 -->
    <section id="tab-budget" class="tab-pane">
      <div class="card">
        <div class="filter-bar">
          <input type="month" id="budget-month">
        </div>
        <div id="budget-overall" class="budget-overall"></div>
        <h3>分类预算</h3>
        <div id="budget-list" class="budget-list"></div>
        <h3>添加分类预算</h3>
        <form id="budget-form" class="inline-form">
          <select id="budget-category"></select>
          <input type="number" id="budget-amount" placeholder="预算金额（元）" min="0.01" step="0.01">
          <button type="submit" class="btn primary">添加</button>
        </form>
      </div>
    </section>

    <!-- 账本与分类页 -->
    <section id="tab-ledger" class="tab-pane">
      <div class="grid-2">
        <div class="card">
          <h2>账本</h2>
          <div id="ledger-list" class="ledger-list"></div>
          <h3>新建账本</h3>
          <form id="ledger-form" class="inline-form">
            <input id="ledger-name" placeholder="账本名称（如：家庭、生意）">
            <button type="submit" class="btn primary">创建</button>
          </form>
        </div>
        <div class="card">
          <h2>分类管理</h2>
          <div class="cat-cols">
            <div>
              <h3>支出分类</h3>
              <div id="cat-expense" class="cat-list"></div>
            </div>
            <div>
              <h3>收入分类</h3>
              <div id="cat-income" class="cat-list"></div>
            </div>
          </div>
          <h3>新增分类</h3>
          <form id="cat-form" class="inline-form">
            <select id="cat-type">
              <option value="expense">支出</option>
              <option value="income">收入</option>
            </select>
            <input id="cat-name" placeholder="分类名称">
            <input id="cat-icon" placeholder="emoji（如 🍜）" maxlength="8">
            <button type="submit" class="btn primary">添加</button>
          </form>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="toast" class="toast hidden"></div>

<script src="vendor/echarts.min.js"></script>
<script src="app.js"></script>
</body>
</html>
