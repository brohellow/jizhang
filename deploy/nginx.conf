# ============================================================
# 记账本 + 主站 Nginx 配置（后端拆分 4 进程后的路由分流）
# 参考配置：/etc/nginx/sites-enabled/jizhang
#
# 端口约定：
#   3000  jizhang-api     记账本主后端（auth/ledgers/categories/records/budgets/stats/token-stats）
#   3001  jizhang-ai      AI 后端（AI 助手 + 江湖模拟器）
#   3002  jizhang-salary  工时工资后端
#   3003  jizhang-sgs     三国杀大厅后端
#   8080/8085  sgs-server 三国杀游戏服务器（WebSocket/TCP 直连，不经过此反代）
# ============================================================

server {
    listen 80;
    server_name 20111108.xyz 124.222.195.163;

    # ===== 静态站点（主站门户） =====
    root /opt/www;
    index index.html;

    # 记账本前端
    location /jizhang/ {
        alias /opt/jizhang/public/;
        try_files $uri $uri/ /jizhang/index.html;
    }

    # 主站各独立页（ai/wuxia/salary/sgs 等）
    location /ai.html { try_files $uri =404; }
    location /wuxia.html { try_files $uri =404; }
    location /salary.html { try_files $uri =404; }
    location /sgs.html { try_files $uri =404; }

    # ===== API 路由分流（注意：更具体的路径必须放在 /api/ 之前） =====
    # AI 后端（含 /api/ai/chat、/api/ai/public-chat、/api/ai/providers、/api/ai/save-state 等）
    location /api/ai/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # AI 流式/长响应
        proxy_send_timeout 120s;
    }

    # 工时工资后端
    location /api/salary/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 三国杀大厅后端
    location /api/sgs/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 记账本主后端（其余所有 /api/*）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== 静态资源缓存 =====
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
